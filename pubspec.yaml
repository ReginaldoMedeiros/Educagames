name: educa_games
description: Educa Games — aprender brincando, no tempo certo. App educativo infantil (4-8 anos) com controle parental.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/mascot/
    - assets/avatars/base/boys/
    - assets/avatars/base/girls/
    - assets/cosmetics/hats/
    - assets/cosmetics/glasses/
